# «Карамель» — окружение развёртывания на shared-хосте.
# Лимиты памяти обязательны: рядом живёт агент, OOM-killer не должен выбирать между ними.
# Порты БД и Redis привязаны к 127.0.0.1 — наружу только через reverse proxy.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karamel_db}
      POSTGRES_USER: ${POSTGRES_USER:-karamel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karamel_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karamel} -d ${POSTGRES_DB:-karamel_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-karamel_redis_pass}", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-karamel_redis_pass} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # Применяет миграции до старта api и worker.
  # Без этого на чистой БД таблиц нет и первое обращение к users падает в 500.
  # Отдельный сервис, а не entrypoint: видно в `docker compose ps`, не даёт гонку при рестарте,
  # а api/worker стартуют только после успешного завершения (service_completed_successfully).
  migrate:
    build: ./services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://karamel:karamel_pass@postgres:5432/karamel_db}
      ENV: ${ENV:-development}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  api:
    build: ./services/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://karamel:karamel_pass@postgres:5432/karamel_db}
      REDIS_URL: ${REDIS_URL:-redis://:karamel_redis_pass@redis:6379/0}
      ENV: ${ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_URL: ${API_URL:-http://api:8000}
      # Стори 11.4 (AC-3, NFR36): версия текста правил, которую фиксирует
      # `POST /consent` в `users.consent_version`. Читает её ИМЕННО `api`
      # (`record_consent`), поэтому переменная живёт здесь, а не у воркеров:
      # в `health-probe` она была бы мёртвой конфигурацией, а невалидное
      # значение валило бы контейнер пробы и гасило uptime-алертинг (NFR65).
      # Обязана совпадать с `MODERATION_RULES_VERSION` в
      # `apps/web/src/lib/moderation-rules.ts` — расхождение ловит
      # `tests/unit/test_rules_version_alignment.py`.
      MODERATION_RULES_VERSION: ${MODERATION_RULES_VERSION:-1.0}
      # Стори 11.10 (AC-2, З-5): канал бэкапа БД. Имена пробрасываются без
      # значений — значения живут в `.env`; в git, лог и стори попадают только
      # имена переменных (граница 2 Dev Notes).
      #
      # ПОЧЕМУ `environment`, А НЕ ТОЛЬКО `env_file`. Замер З-5: у `api` есть
      # `env_file: .env`, и `docker compose config` действительно РЕЗОЛВИТ эти
      # пять имён через него (25 совпадений = 5 имён × 5 сервисов). То есть
      # `env_file` работает — но `env_file` читается только при СОЗДАНИИ
      # контейнера, а `docker compose restart` его не перечитывает. Факт замера:
      # контейнер `api` создан `2026-10-26 20:26:06`, `.env` изменён `20:45:39`
      # — на 19 минут позже, поэтому в работающем контейнере имён НЕТ (`[]`).
      # Явное перечисление делает зависимость видимой в `docker-compose.yml`, а
      # не выводимой из порядка двух внешних файлов; обновление по-прежнему
      # требует `up -d --force-recreate api`, а не `restart` (ловушка Л-1).
      #
      # `S3_BACKUP_*` ≠ `S3_*`: первый — бакет дампов БД (`karamel-backup`),
      # второй — фото профилей (`karamel-media`). Смешать = положить дампы в
      # бакет с другой политикой (граница 1 Dev Notes).
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:-}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:-}
      # Стори 1.3: имена пробрасываются без значений — секреты живут только в .env,
      # иначе `docker compose config` и история git раскрывают client_secret.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
      # Стори 1.4: SMS-вход. `SMS_CODE_SECRET` вне dev обязателен и не короче 32
      # символов (openssl rand -hex 32) — иначе приложение не стартует.
      SMS_PROVIDER: ${SMS_PROVIDER:-stub}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      SMS_CODE_SECRET: ${SMS_CODE_SECRET:-}
      # Фикс OOM (2026-10-22): предел размера тела запроса. Тело на ~10 МБ
      # роняло контейнер по OOM; гард в `app/core/body_limit.py` отбивает его
      # `413 request_too_large` до чтения в память. Дефолт совпадает с дефолтом
      # `Settings.max_request_body_bytes` — `.env` можно не менять.
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      # Стори 2.2 (AC-08): лимит самого файла фото. Маршрут загрузки получает
      # в гарде `MAX_PHOTO_BYTES + 64 КиБ` на обвязку multipart, остальные —
      # прежний 1 МиБ. Дефолт совпадает с `Settings.max_photo_bytes`.
      MAX_PHOTO_BYTES: ${MAX_PHOTO_BYTES:-5242880}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Стори 4.6 (AC-05, AR33/AR34): воркер окон и архива карточек.
  #
  # Отдельный контейнер, а не второй цикл в `worker` (`likes_reset`): разные
  # задачи не должны делить процесс — падение одной не останавливает другую,
  # а в `docker compose ps` видно, что именно живо. Своя транзакция на прогон,
  # свой пул соединений, свой лимит памяти.
  worker-cards:
    build: ./services/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://karamel:karamel_pass@postgres:5432/karamel_db}
      REDIS_URL: ${REDIS_URL:-redis://:karamel_redis_pass@redis:6379/0}
      ENV: ${ENV:-development}
    command: ["python", "-m", "app.workers.card_windows"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 192m

  # Стори 10.7 (AC-01/AC-03; D-10.7-5, NFR62): health-probe — ОТДЕЛЬНЫЙ контейнер,
  # а не поток внутри api.
  #
  # Проба внутри api-процесса исчезает ровно тогда, когда api упал, — в
  # единственном случае, ради которого она существует. Отдельный контейнер
  # живёт на своём лимите памяти, виден в `docker compose ps` и не конкурирует
  # с обработкой запросов.
  #
  # `healthcheck:` НЕ ставится НАМЕРЕННО: проверка probe — сам алерт, а
  # healthcheck добавил бы второй, независимый сигнал «контейнер жив»,
  # который ничего не говорит о наблюдаемом сервисе и при этом заставил бы
  # compose перезапускать probe на каждом ложном срабатывании.
  #
  # `depends_on` только migrate+redis: api в зависимостях НЕТ — probe обязан
  # стартовать и тогда, когда api не поднялся (иначе он бы не смог сообщить
  # об этом). Он опрашивает api по HTTP через `API_URL` и получит отказ
  # соединения, что и есть первая неудача.
  health-probe:
    build: ./services/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://karamel:karamel_pass@postgres:5432/karamel_db}
      REDIS_URL: ${REDIS_URL:-redis://:karamel_redis_pass@redis:6379/0}
      ENV: ${ENV:-development}
      # Адрес api внутри сети compose: probe ходит на `/health/deep`.
      API_URL: ${API_URL:-http://api:8000}
      # Токен и чат через `${VAR:-}` — пустое значение допустимо (D-10.7-4):
      # алертинг выключен, probe работает. Это НЕ ошибка старта.
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_PROBE_INTERVAL_SECONDS: ${ALERT_PROBE_INTERVAL_SECONDS:-60}
      ALERT_CONSECUTIVE_FAILURES: ${ALERT_CONSECUTIVE_FAILURES:-2}
    command: ["python", "-m", "app.workers.health_probe"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 128m

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://api:8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m

  worker:
    build: ./services/api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://karamel:karamel_pass@postgres:5432/karamel_db}
      REDIS_URL: ${REDIS_URL:-redis://:karamel_redis_pass@redis:6379/0}
      ENV: ${ENV:-development}
    command: ["python", "-m", "app.workers.retention"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 192m

volumes:
  pgdata:
  redisdata:
